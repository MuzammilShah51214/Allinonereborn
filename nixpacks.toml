[phases.setup]
nixPkgs = ["nodejs_20", "nss", "freetype", "harfbuzz", "ca-certificates", "ttf-freefont"]

[phases.install]
cmds = [
  "npm install",
  "PUPPETEER_CACHE_DIR=/app/.cache/puppeteer npx puppeteer browsers install chrome"
]

[variables]
PUPPETEER_CACHE_DIR = "/app/.cache/puppeteer"

[start]
cmd = "npm start"
